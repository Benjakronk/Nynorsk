<!doctype html>
<meta charset="utf-8">
<title>Skjermbilete av spelet</title>
<!-- Brukt av skjermbilete.py: opnar spelet, går til eit kart og frys lerretet.
     Parametrar: kart, m (merke), x og y (der Ivar står), kamp (fiendar, kommaskilt),
     parti (fleire i partiet), hp (til dømes huldra:4), tale (namn:tekst),
     gaa (opp/ned/venstre/hogre), ventms, kjensle (til dømes sjokk) og hkjensle (for følgjet), pose (til dømes knele),
     retning (0 til 3, saman med pose), vinn=1 og etter=1. -->
<style>body{margin:0;background:#000;color:#fff;font:12px monospace} iframe{width:1100px;height:720px;border:0;display:block} #ut{white-space:pre-wrap;padding:4px}</style>
<iframe id="f"></iframe>
<div id="ut">køyrer …</div>
<script>
const q = new URLSearchParams(location.search);
const f = document.getElementById("f");
f.src = "../../spel.html?test=1";
const vent = ms => new Promise(r => setTimeout(r, ms));
const feil = [];
f.onload = async () => {
  const w = f.contentWindow, d = w.document, M = w.Motor;
  w.addEventListener("error", e => feil.push(e.message + " :" + e.lineno));
  const tast = async k => { d.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true })); await vent(30); d.dispatchEvent(new w.KeyboardEvent("keyup", { key: k, bubbles: true })); };
  const synleg = sel => { const e = d.querySelector(sel); return e && !e.hidden; };
  // Frys lerretet: eit bilete av det over lerretet, så det ikkje endrar seg før skjermbiletet blir teke.
  const frys = () => { const c = d.getElementById("rpg-lerret"), img = d.createElement("img"); img.src = c.toDataURL(); img.style.cssText = `position:absolute;width:${c.style.width};height:${c.style.height};image-rendering:pixelated;z-index:9;pointer-events:none`; const r = c.getBoundingClientRect(), p = d.getElementById("rpg-skjerm").getBoundingClientRect(); img.style.left = (r.left - p.left) + "px"; img.style.top = (r.top - p.top) + "px"; d.getElementById("rpg-skjerm").appendChild(img); };
  const blaFram = async () => { let n = 0; while (n++ < 200 && (synleg("#rpg-tale") || synleg("#rpg-fort"))) { await tast("z"); await vent(80); } };
  // Vent til grafikken er lasta og tittelskjermen har knappar.
  for (let n = 0; n < 200 && !d.querySelector("#rpg-tittel-val button"); n++) await vent(50);
  d.querySelector("#rpg-tittel-val button").click();
  await vent(300); await blaFram();
  w.RPGTest.st().flagg.framande1 = true;
  M.last(q.get("kart") || "asen", q.get("m") || "1"); await vent(400); await blaFram();
  if (q.get("x")) Object.assign(M.spelar, { x: +q.get("x"), y: +q.get("y"), fx: +q.get("x"), fy: +q.get("y"), dir: 0 });
  // parti=huldra legg til medlemer, hp=huldra:4 set livet (til dømes for å sjå «svak» og «slått ut» i kampen).
  const st = w.RPGTest.st();
  for (const id of (q.get("parti") || "").split(",").filter(Boolean)) if (!st.parti.some(m => m.id === id)) st.parti.push({ id, niva: st.parti[0].niva, xp: 0, hp: null, rost: null });
  for (const x of (q.get("hp") || "").split(",").filter(Boolean)) { const [id, n] = x.split(":"), m = st.parti.find(m => m.id === id); if (m) m.hp = +n; }
  // kampms=300: frys biletet så lenge etter at kampen er starta (for å sjå pikseleffekten og toninga).
  if (q.get("kamp") && q.get("kampms")) { M.krokar.kamp(q.get("kamp").split(",")); await vent(+q.get("kampms")); frys(); document.getElementById("ut").textContent = "ferdig"; return; }
  if (q.get("kamp")) { M.krokar.kamp(q.get("kamp").split(",")); let n = 0; while (!synleg(".kamp-meny") && n++ < 300) await vent(50); }
  // tale=Huldra:Teksten opnar samtaleboksen med portrettet til den som talar.
  if (q.get("kjensle")) M.kjensle(q.get("kjensle"));
  if (q.get("hkjensle")) M.kjensle(q.get("hkjensle"), "fylgje");
  if (q.get("pose")) { M.pose(q.get("pose")); if (q.get("retning")) M.spelar.dir = +q.get("retning"); }
  if (q.get("tale")) { const [namn, ...t] = q.get("tale").split(":"); M.tale(t.join(":") || "…", namn, q.get("kjensle")); await vent(2500); }
  // gaa=opp held ei piltast nede i «ventms» millisekund før biletet blir teke (til dømes for å sjå ei dør opne seg).
  if (q.get("gaa")) {
    const k = { opp: "ArrowUp", ned: "ArrowDown", venstre: "ArrowLeft", hogre: "ArrowRight" }[q.get("gaa")];
    await vent(600); d.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true }));
    await vent(+(q.get("ventms") || 300)); frys(); d.dispatchEvent(new w.KeyboardEvent("keyup", { key: k, bubbles: true }));
    document.getElementById("ut").textContent = "ferdig, feil: " + JSON.stringify(feil); return;
  }
  // vinn=1: alle fiendane fell, så ein kan sjå sigerfeiringa og løna i kampscena.
  if (q.get("vinn")) {
    const fi = w.KampTest.fiendar; fi.forEach((f, i) => { f.hp = i < fi.length - 1 ? 0 : 1; });
    for (const k of ["z", "z"]) { d.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true })); await vent(40); d.dispatchEvent(new w.KeyboardEvent("keyup", { key: k, bubbles: true })); await vent(300); }
    await vent(+(q.get("ventms") || 2400));
    // etter=1: bla gjennom sigerlinene og sjå kartet kome att etter kampen.
    if (q.get("etter")) for (let n = 0; n < 8; n++) { d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "z", bubbles: true })); await vent(40); d.dispatchEvent(new w.KeyboardEvent("keyup", { key: "z", bubbles: true })); await vent(350); } frys(); document.getElementById("ut").textContent = "ferdig, feil: " + JSON.stringify(feil); return; }
  await vent(900); frys();
  document.getElementById("ut").textContent = "ferdig, feil: " + JSON.stringify(feil);
};
</script>
