<!doctype html>
<meta charset="utf-8">
<title>Sjekk gangen i kyrkja</title>
<!-- Måler kor lang tid Ivar brukar frå døra i kyrkja (merke 1) opp til altarringen (rad 9):
     først gåande (pil opp), så springande (Z og pil opp). Målet er 33 fliser: 6,6 sekund å gå
     (12 tikk per flis) og om lag 6,7 sekund å springe (8 tikk per flis).
     Køyr: python tools/kjoyr-test.py tools/sjekk-kyrkjegang.html 60000 -->
<style>body{margin:0;background:#000;color:#fff;font:12px monospace} iframe{width:1100px;height:720px;border:0} #ut{white-space:pre-wrap;padding:4px}</style>
<iframe id="f"></iframe>
<div id="ut">køyrer …</div>
<script>
const f = document.getElementById("f");
f.src = "../spel.html?test=1";
const vent = ms => new Promise(r => setTimeout(r, ms));
f.onload = async () => {
  const w = f.contentWindow, d = w.document, M = w.Motor;
  const tast = (type, k) => d.dispatchEvent(new w.KeyboardEvent(type, { key: k, bubbles: true }));
  const synleg = sel => { const e = d.querySelector(sel); return e && !e.hidden; };
  for (let n = 0; n < 200 && !d.querySelector("#rpg-tittel-val button"); n++) await vent(50);
  d.querySelector("#rpg-tittel-val button").click();
  await vent(300);
  for (let n = 0; n < 400 && (!w.RPGTest.st().scener.heime || synleg("#rpg-tale") || synleg("#rpg-fort")); n++) { tast("keydown", "z"); await vent(30); tast("keyup", "z"); await vent(60); }
  await vent(1000);
  const ut = [];
  let ok = true;
  const D = w.RPGData.KART.kyrkja, dor = D.rader.findIndex(r => r.includes("1"));
  ut.push(`fliser frå merke 1 (rad ${dor}) til framfor altarringen (rad 9): ${dor - 9}`);
  if (dor - 9 !== 33) { ok = false; ut.push("FEIL: avstanden skal vere 33 fliser"); }
  for (const [namn, springe, maal] of [["gå", false, 33 * 0.2], ["springe", true, 33 * 8 / 60]]) {
    M.last("kyrkja", "1"); await vent(400);
    M.spelar.dir = 1;                                   // ser opp, så det første steget ikkje er ei snuing
    const t0 = w.performance.now();
    if (springe) tast("keydown", "z");
    tast("keydown", "ArrowUp");
    let t1 = null;
    for (let n = 0; n < 2000 && t1 === null; n++) { await vent(10); if (M.spelar.fy <= 9) t1 = w.performance.now(); }
    tast("keyup", "ArrowUp"); if (springe) tast("keyup", "z");
    const s = t1 === null ? null : (t1 - t0) / 1000;
    const rett = s !== null && Math.abs(s - maal) < 0.35;
    if (!rett) ok = false;
    ut.push(`${rett ? "OK" : "FEIL"}: å ${namn} frå døra til altarringen tok ${s === null ? "for lang tid (stoppa på " + M.spelar.x + "," + M.spelar.y + ")" : s.toFixed(2) + " s"} (venta ${maal.toFixed(2)} s)`);
    await vent(300);
  }
  // Trappa: frå våpenhuset opp på galleriet, vidare opp i tårnet, og ned att same vegen.
  const gaaTil = async (kart, merke, tast_, maal, x, y) => {
    M.last(kart, merke); await vent(400);
    tast("keydown", tast_);
    let n = 0; while (n++ < 300 && M.kart.id !== maal) await vent(20);
    tast("keyup", tast_); await vent(700);
    const rett = M.kart.id === maal && (x == null || (M.spelar.x === x && M.spelar.y === y));
    if (!rett) ok = false;
    ut.push(`${rett ? "OK" : "FEIL"}: frå ${kart} (${merke}) til ${M.kart.id} (${M.spelar.x},${M.spelar.y})`);
  };
  await gaaTil("kyrkja", "3", "ArrowUp", "kyrkje-galleri", 10, 10);
  await gaaTil("kyrkje-galleri", "2", "ArrowDown", "kyrkje-tarn", 6, 10);
  await gaaTil("kyrkje-tarn", "1", "ArrowDown", "kyrkje-galleri", 19, 10);
  await gaaTil("kyrkje-galleri", "1", "ArrowDown", "kyrkja", 8, 38);
  // Preikestolen: frå koret (5,12) mot venstre inn i veggen, gjennom gangen (skjult) og ut i korga (1,12).
  M.last("kyrkja", "1"); await vent(300);
  M.plasser(5, 12, 2); await vent(300);
  const skjult = w.RPGData.KART.kyrkja.skjult || [];
  let varSkjult = false;
  tast("keydown", "ArrowLeft");
  { let n = 0; while (n++ < 300 && M.spelar.x !== 1) { await vent(20); if (skjult.includes(M.spelar.x + "," + M.spelar.y)) varSkjult = true; } }
  tast("keyup", "ArrowLeft"); await vent(500);
  const iStolen = M.spelar.x === 1 && M.spelar.y === 12 && varSkjult && !skjult.includes("1,12");
  if (!iStolen) ok = false;
  ut.push(`${iStolen ? "OK" : "FEIL"}: Ivar gjekk inn i veggen frå koret, skjult gjennom gangen og ut i preikestolen (${M.spelar.x},${M.spelar.y})`);
  // Z mot bibelen i preikestolen, og mot klokketauet i tårnet: hendinga går, og teksten kjem.
  const tekst = () => [...d.querySelectorAll("#rpg-tale, #rpg-fort")].filter(e => !e.hidden).map(e => e.textContent).join(" ");
  const trykkGjennom = async (finn, kvar) => {
    let sett = false;
    for (let n = 0; n < 120; n++) {
      if (finn.test(tekst())) { sett = true; if (kvar) kvar(); }
      tast("keydown", "z"); await vent(40); tast("keyup", "z"); await vent(160);
      if (n > 3 && !w.RPGTest.iHending() && !synleg("#rpg-tale") && !synleg("#rpg-fort")) break;
    }
    return sett;
  };
  M.spelar.dir = 0; await vent(100);
  const preika = await trykkGjennom(/kyrkjelyd|benkene/);
  if (!preika) ok = false;
  ut.push(`${preika ? "OK" : "FEIL"}: Z mot bibelen i preikestolen gir ei lita preike`);
  M.last("kyrkje-tarn", "1"); await vent(300); M.plasser(8, 8, 1); await vent(300);
  const utslag = new Set();
  const dong = await trykkGjennom(/DONG/, () => utslag.add(M.aktor("Klokka").vesen));
  const svinga = utslag.has("klokke-0") && utslag.has("klokke-8") && M.aktor("Klokka").vesen === "klokke-4";
  if (!dong || !svinga) ok = false;
  ut.push(`${dong && svinga ? "OK" : "FEIL"}: Ivar dreg i klokketauet, klokka svingar ut til begge sider og slår (DONG), og heng stille etterpå`);
  const flaug = !M.aktor("Dua");
  if (!flaug) ok = false;
  ut.push(`${flaug ? "OK" : "FEIL"}: dua flaug ut gjennom lydluka`);
  const dong2 = await trykkGjennom(/DONG/);
  if (!dong2) ok = false;
  ut.push(`${dong2 ? "OK" : "FEIL"}: klokka kan slå ein gong til`);
  M.last("kyrkje-tarn", "1"); await vent(300);
  const att = !!M.aktor("Dua");
  if (!att) ok = false;
  ut.push(`${att ? "OK" : "FEIL"}: dua er attende når Ivar kjem inn i tårnet att`);
  ut.push(ok ? "Alt ser rett ut." : "Noko er feil.");
  document.getElementById("ut").textContent = ut.join("\n");
  f.remove();
};
</script>
