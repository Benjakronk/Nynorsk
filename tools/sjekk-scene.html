<!doctype html>
<meta charset="utf-8">
<title>Sjekk scenemotoren</title>
<!-- Køyrer scenene «heime», «framande» og «minne_far» og hendingane på Åsen, i Hovdebygda, i utmarka, på Ekset og i arkivet, og sjekkar at regien gjer det han
     skal: figurar som går, kameraet som følgjer og kjem attende, trådar, dagbok, val og scenekart.
     Opne i ein nettlesar, eller:
     msedge --headless=new --disable-gpu --allow-file-access-from-files --virtual-time-budget=60000 --dump-dom .../sjekk-scene.html -->
<style>body{margin:0;background:#000;color:#fff;font:12px monospace} iframe{width:1100px;height:720px;border:0} #ut{white-space:pre-wrap;padding:4px}</style>
<iframe id="f"></iframe>
<div id="ut">køyrer …</div>
<script>
const f = document.getElementById("f");
f.src = "../spel.html?test=1";
const vent = ms => new Promise(r => setTimeout(r, ms));
const ut = [];
// Resultata blir viste etter kvart, så ein ser kvar testen stoppa om han heng.
const sjekk = (ok, tekst) => { ut.push(`${ok ? "OK  " : "FEIL"} ${tekst}`); document.getElementById("ut").textContent = ut.join("\n") + "\nkøyrer …"; };
f.onload = async () => {
  const w = f.contentWindow, d = w.document, M = w.Motor, T = () => w.RPGTest;
  const tast = k => { d.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true })); d.dispatchEvent(new w.KeyboardEvent("keyup", { key: k, bubbles: true })); };
  const synleg = sel => { const e = d.querySelector(sel); return e && !e.hidden; };
  // Trykkjer Z gjennom samtalar til hendinga er ferdig. logg() blir kalla kvar runde.
  async function trykkGjennom(ferdig, logg) {
    for (let n = 0; n < 600 && !ferdig(); n++) {
      if (logg) logg();
      if (synleg("#rpg-tale") || synleg("#rpg-fort") || d.querySelector(".rpg-kort")) tast("z");
      await vent(70);
    }
  }
  try {
    for (let n = 0; n < 200 && !d.querySelector("#rpg-tittel-val button"); n++) await vent(50);
    d.querySelector("#rpg-tittel-val button").click();
    await vent(300);

    // 1. «heime»: storebror går bort til Ivar, så tilbake til plassen sin.
    let naerIvar = false;
    await trykkGjennom(() => T().st().scener.heime && !M.aktor("Storebror").regi, () => {
      const b = M.aktor("Storebror"), s = M.spelar;
      if (b && Math.abs(b.x - s.x) + Math.abs(b.y - s.y) === 1) naerIvar = true;
    });
    await vent(1500);
    const b = M.aktor("Storebror");
    sjekk(T().st().scener.heime, "scena «heime» er merkt som spela");
    sjekk(naerIvar, "storebror gjekk bort til Ivar");
    sjekk(b.x === 8 && b.y === 3, `storebror gjekk attende til plassen sin (står på ${b.x},${b.y})`);

    // 2. «framande»: den framande går til Ivar, kameraet følgjer han ut av kartet og kjem attende.
    M.last("asen", "3");
    let kameraBort = false, framandeGjekk = false;
    await trykkGjennom(() => T().st().flagg.framande1 && T().st().dagbok.length > 0, () => {
      const fr = M.aktor("Ein framand");
      if (fr && fr.y < 3) framandeGjekk = true;
    });
    await vent(1200);
    sjekk(framandeGjekk, "den framande gjekk opp vegen");
    sjekk(!M.aktor("Ein framand"), "den framande er borte frå kartet");
    sjekk(T().st().nokkel.includes("ordboka"), "Ivar fekk ordboka");
    sjekk(!!T().st().traadar.framande, "tråden «framande» er opna");
    sjekk(T().st().dagbok.length === 1, "Dagboka har éi linje");
    sjekk(T().modus() === "felt" && !M.spelar.regi, "spelaren kan gå att etter scena");

    // 3. Val som blir hugsa, saman-steg og effektar.
    const t0 = performance.now();
    const p = T().hending([
      { val: "Prøveval?", alt: ["A", "B"], id: "prove", svar: [[{ flagg: "valA" }], [{ flagg: "valB" }]] },
      { saman: [[{ vent: 300 }], [{ vent: 300 }]] },
      { blink: 1 }, { rist: 200 },
      { inn: { namn: "Gjest", u: "bonde", rute: [10, 8], retning: "opp" } },
      { gaa: "Gjest", sti: "h2" },
      { dagbok: "Prøve." },
    ]);
    await vent(200); tast("ArrowDown"); await vent(50); tast("z");
    await p;
    const gj = M.aktor("Gjest");
    sjekk(T().st().val.prove === 1 && T().st().flagg.valB, "valet B er hugsa i st.val");
    sjekk(gj && gj.x === 12 && gj.y === 8, `gjesten gjekk stien h2 (står på ${gj && gj.x},${gj && gj.y})`);
    sjekk(performance.now() - t0 > 300, "saman ventar på begge listene");

    // 4. «framande» blir hoppa over: B ved første replikk, ja. Utfallet skal vere gjort likevel.
    const s4 = T().st();
    delete s4.flagg.framande1; delete s4.traadar.framande; s4.dagbok = []; s4.nokkel = s4.nokkel.filter(n => n !== "ordboka");
    M.fjernFolk("Gjest");
    M.last("asen", "3");
    for (let n = 0; n < 100 && !synleg("#rpg-tale"); n++) await vent(50);
    tast("x"); await vent(150);
    sjekk(synleg("#rpg-tale") && /Hoppe over scena/.test(d.querySelector("#rpg-tale").textContent), "B spør om scena skal hoppast over");
    const t4 = performance.now();
    tast("z");
    for (let n = 0; n < 60 && !(s4.flagg.framande1 && s4.dagbok.length && !M.snogg); n++) await vent(50);
    sjekk(performance.now() - t4 < 1500, `resten av scena gjekk snøgt (${Math.round(performance.now() - t4)} ms)`);
    await vent(300);
    sjekk(s4.flagg.framande1 && s4.nokkel.includes("ordboka") && s4.traadar.framande && s4.dagbok.length === 1, "flagg, ordboka, tråden og Dagboka er likevel gjort");
    sjekk(!M.aktor("Ein framand"), "den framande er borte frå kartet");
    sjekk(s4.scener.framande && !M.snogg, "scena er ferdig og snøggmodusen er slått av");
    sjekk(synleg("#rpg-tale") && /Ordboka ligg i menyen/.test(d.querySelector("#rpg-tale").textContent), "rettleiinga etter scena blir vist likevel");
    await trykkGjennom(() => !synleg("#rpg-tale"));
    await vent(200);
    sjekk(T().modus() === "felt" && !M.spelar.regi, "spelaren kan gå att etter scena");

    // 5. Ein mellomsekvens med gange, kamera, toning og val. Valet blir vist sjølv om scena blir hoppa over.
    w.RPGData.SCENER.provehopp = { namn: "Prøve", hopp: true, kort: false, steg: [
      { inn: { namn: "Hoppar", u: "bonde", rute: [10, 8], retning: "opp" } },
      { s: "Hoppar", t: "No går eg ein runde." },
      { gaa: "Hoppar", sti: "h2n1", fart: 500 },
      { kamera: "Hoppar", ms: 2000 },
      { ton: "svart", ms: 1000 }, { vent: 3000 }, { rist: 1000 }, { blink: 1 },
      { kort: ["Prøve", "no"] }, { naerbilete: "bilete/finst-ikkje.png", tekst: "Hoppa over." },
      { val: "Kva vel du?", alt: ["A", "B"], id: "hoppval", svar: [[{ flagg: "hoppA" }], [{ flagg: "hoppB" }, { s: "Hoppar", t: "B, altså." }]] },
      { gaa: "Hoppar", mot: "Ivar" },
      { flagg: "hoppa" }, { traad: "hopp", tekst: "Prøvetråd" }, { dagbok: "Hoppa over." },
      { kamera: null },
    ] };
    const p5 = T().scene("provehopp");
    for (let n = 0; n < 60 && !synleg("#rpg-tale"); n++) await vent(50);
    tast("x"); await vent(150); tast("z");
    let valSett = false;
    for (let n = 0; n < 60 && !valSett; n++) { await vent(50); valSett = synleg("#rpg-tale") && /Kva vel du/.test(d.querySelector("#rpg-tale").textContent); }
    sjekk(valSett, "valet blir vist i snøggmodus");
    const h = M.aktor("Hoppar");
    sjekk(h && h.x === 12 && h.y === 9 && h.dir === 0, `figuren står på målruta og ser ned (${h && h.x},${h && h.y}, retning ${h && h.dir})`);
    tast("ArrowDown"); await vent(50); tast("z");
    await p5;
    await vent(100);
    const s5 = T().st(), sp = M.spelar;
    sjekk(s5.val.hoppval === 1 && s5.flagg.hoppB && s5.flagg.hoppa, "valet er hugsa og flagga er sette");
    sjekk(s5.traadar.hopp && s5.dagbok.some(l => l.tekst === "Hoppa over."), "tråden og Dagboka er skrivne");
    sjekk(Math.abs(h.x - sp.x) + Math.abs(h.y - sp.y) === 1, `figuren gjekk bort til Ivar (${h.x},${h.y})`);
    const mot = h.x < sp.x ? 3 : h.x > sp.x ? 2 : h.y < sp.y ? 0 : 1;
    sjekk(h.dir === mot, "figuren ser mot Ivar");
    sjekk(!M.svart && !M.snogg, "skjermen er tona inn att, og snøggmodusen er slått av");
    sjekk(!d.querySelector(".rpg-kort") && !d.querySelector(".rpg-naer"), "kortet og nærbiletet er borte");

    // 6. Nei: samtalen kjem attende, og scena held fram som før.
    w.RPGData.SCENER.provenei = { namn: "Prøve", hopp: true, kort: false, steg: [
      { s: "Hoppar", t: "Første replikk." }, { s: "Hoppar", t: "Andre replikk." }, { flagg: "neiFerdig" },
    ] };
    const p6 = T().scene("provenei");
    for (let n = 0; n < 60 && !synleg("#rpg-tale"); n++) await vent(50);
    await vent(300);
    tast("x"); await vent(150); tast("ArrowDown"); await vent(50); tast("z"); await vent(150);
    const tekst6 = synleg("#rpg-tale") ? d.querySelector("#rpg-tale").textContent : "";
    sjekk(/Første replikk/.test(tekst6) && !/Hoppe over/.test(tekst6), "ved nei kjem replikken attende");
    tast("z"); await vent(150);
    sjekk(synleg("#rpg-tale") && /Andre replikk/.test(d.querySelector("#rpg-tale").textContent), "scena held fram med neste replikk");
    await trykkGjennom(() => T().st().flagg.neiFerdig);
    await p6;
    sjekk(!M.snogg, "snøggmodusen vart aldri slått på");

    // 7. Scenekart: minnet om far første gong Ivar kviler ved lampa i stova. Huldra er med i
    //    partiet, men ikkje i minnet. Lagring på scenekartet skal lagre staden før scena.
    const NOKKEL = "nynorskkurs:rpg:v2", gamalLagring = w.localStorage.getItem(NOKKEL);
    const s7 = T().st();
    s7.parti.push({ id: "huldra", niva: 1, xp: 0, hp: null, rost: null });
    M.settFylgje(w.Pikslar.figur(w.RPGData.U.huldra));
    M.last("asen-stova", "1"); M.plasser(2, 6, 2);                   // framfor lampa, ser mot henne
    await vent(200);
    tast("z");
    let paaMinne = false, fylgjeIMinne = false, lagraUnder = null, forUnder = null, vedFar = false, satt = false, sattAtt = false, peika = false, sitIMinne = false;
    await trykkGjennom(() => s7.scener.minne_far, () => {
      if (M.kart.id !== "minne-far") { if (M.spelar.pose === "sitje" && M.spelar.dir === 2) { if (paaMinne) sattAtt = true; else satt = true; } return; }
      paaMinne = true;
      if (M.aktor("fylgje")) fylgjeIMinne = true;
      const far = M.aktor("Far"), sp = M.spelar;
      if (far && far.pose === "peike" && far.dir === 3) peika = true;
      if (sp.pose) sitIMinne = true;
      if (far && Math.abs(far.x - sp.x) + Math.abs(far.y - sp.y) === 1) vedFar = true;
      if (!lagraUnder) { forUnder = T().forScene(); T().lagre(); lagraUnder = T().lagra(); }
    });
    for (let n = 0; n < 60 && !(synleg("#rpg-tale") && /Vil du lagre/.test(d.querySelector("#rpg-tale").textContent)); n++) await vent(50);
    sjekk(synleg("#rpg-tale") && /Vil du lagre/.test(d.querySelector("#rpg-tale").textContent), "etter minnet spør spelet om lagring som vanleg");
    tast("ArrowDown"); await vent(50); tast("z"); await vent(300);
    sjekk(paaMinne, "minnet vart spela på scenekartet «minne-far»");
    sjekk(forUnder && forUnder.kart === "asen-stova" && forUnder.x === 2 && forUnder.y === 6, "staden før scena er hugsa");
    sjekk(!fylgjeIMinne, "huldra er ikkje med i minnet");
    sjekk(vedFar, "Ivar gjekk bort til far");
    sjekk(satt, "Ivar sette seg ved lampa (pose sitje, mot venstre)");
    sjekk(!sitIMinne, "i minnet står Ivar (på eit nytt kart står ein)");
    sjekk(sattAtt, "attende ved lampa sit Ivar att, slik han sat før minnet");
    sjekk(peika, "far peika utover mot høgre");
    sjekk(lagraUnder && lagraUnder.kart === "asen-stova" && lagraUnder.pos.x === 2 && lagraUnder.pos.y === 6 && lagraUnder.pos.dir === 2,
      `lagring i minnet lagrar stova og ruta før (${lagraUnder && lagraUnder.kart} ${lagraUnder && JSON.stringify(lagraUnder.pos)})`);
    const sp7 = M.spelar;
    sjekk(M.kart.id === "asen-stova" && sp7.x === 2 && sp7.y === 6 && sp7.dir === 2, `Ivar er attende ved lampa og ser same vegen (${M.kart.id} ${sp7.x},${sp7.y}, retning ${sp7.dir})`);
    sjekk(!!M.aktor("fylgje") && !T().forScene(), "huldra er med att, og scenekartet er gløymt");
    sjekk(s7.dagbok.some(l => /tenkje på far/.test(l.tekst)), "minnet står i Dagboka");
    sjekk(!M.svart && T().modus() === "felt" && !M.spelar.regi, "skjermen er tona inn, og spelaren kan gå att");
    sjekk(!sp7.pose, "etter hendinga står Ivar opp att");

    // 8. Scenekart med følgjet, hoppa over: resten går snøgt, og Ivar kjem attende til same rute.
    w.RPGData.SCENER.provekart = { namn: "Prøve", hopp: true, kort: false, steg: [
      { scenekart: "minne-far", merke: "1", retning: "opp", fylgje: true, ms: 600 },
      { s: "Far", t: "Er huldra med no?" },
      { vent: 3000 }, { gaa: "Ivar", sti: "v3" },
      { scenekart: null, ms: 1500 },
      { flagg: "kartFerdig" },
    ] };
    const p8 = T().scene("provekart");
    for (let n = 0; n < 80 && !synleg("#rpg-tale"); n++) await vent(50);
    sjekk(M.kart.id === "minne-far" && M.spelar.dir === 1, "scenekartet er lasta, og Ivar ser opp");
    sjekk(!!M.aktor("fylgje"), "med fylgje: true er huldra med på scenekartet");
    tast("x"); await vent(150);
    const t8 = performance.now();
    tast("z");
    await p8;
    sjekk(performance.now() - t8 < 1500, `resten av scena gjekk snøgt (${Math.round(performance.now() - t8)} ms)`);
    const sp8 = M.spelar;
    sjekk(s7.flagg.kartFerdig && M.kart.id === "asen-stova" && sp8.x === 2 && sp8.y === 6 && sp8.dir === 2, `etter hoppet står Ivar ved lampa att (${M.kart.id} ${sp8.x},${sp8.y})`);
    sjekk(!M.svart && !M.snogg && !T().forScene(), "skjermen er tona inn, og scenekartet er gløymt");

    // 9. Posar: knele, sitje, peike, liggje og sove. Posen varer til figuren går eller hendinga
    //    er slutt, og folk med pose i kartet (syster ved bordet) får han att etterpå.
    const feil9 = []; w.addEventListener("error", e => feil9.push(e.message));
    const piks = c => { try { return c.getContext("2d").getImageData(0, 0, c.width, c.height).data.join(","); } catch (e) { return "utilgjengeleg"; } };
    const tom = c => !/[1-9]/.test(piks(c).split(",").filter((_, i) => i % 4 === 3).join(""));
    for (const id of ["bonde", "syster", "ivar", "huldra"]) {
      const fig = w.Pikslar.figur(w.RPGData.U[id]);
      const ok = w.Pikslar.ARKPOSAR.every(p => fig.pose[p].length === 4 &&
        [0, 1, 2, 3].every(dir => !tom(fig.pose[p][dir]) && piks(fig.pose[p][dir]) !== piks(fig.rammer[dir][0])));
      sjekk(ok, `${id}: knele, sitje og peike er lesne frå arket i fire retningar`);
      sjekk(fig.pose.liggje === fig.kamp.ute && fig.pose.sove === fig.kamp.ute, `${id}: liggje og sove brukar ramma for slått ut`);
    }
    M.last("asen-stova", "1"); M.plasser(6, 5, 0);
    await vent(300);
    const syster = M.aktor("Syster");
    sjekk(syster && syster.pose === "sitje", "syster sit ved bordet (grunnpose frå kartet)");
    let under9 = null, etterGang = null;
    const p9 = T().hending([
      { inn: { namn: "Knelar", u: "bonde", rute: [8, 5], retning: "venstre" } },
      { pose: "Knelar", p: "knele" }, { pose: "Ivar", p: "sitje" }, { pose: "Syster", p: "peike" }, { pose: "Huldra", p: "knele" },
      { vent: 400 }, { flagg: "pose1" }, { vent: 300 },
      { gaa: "Knelar", sti: "n1" }, { flagg: "pose2" }, { vent: 200 },
      { pose: "Ivar", p: "sove" }, { pose: "Huldra", p: null }, { vent: 300 }, { flagg: "pose3" }, { vent: 300 },
    ]);
    for (let n = 0; n < 100 && !T().st().flagg.pose1; n++) await vent(30);
    const kn = M.aktor("Knelar");
    under9 = { knelar: kn && kn.pose, dir: kn && kn.dir, ivar: M.spelar.pose, syster: M.aktor("Syster").pose, huldra: M.aktor("fylgje") && M.aktor("fylgje").pose };
    sjekk(under9.knelar === "knele" && under9.dir === 2, `ein ny person kneler mot venstre (${under9.knelar}, retning ${under9.dir})`);
    sjekk(under9.ivar === "sitje" && under9.syster === "peike" && under9.huldra === "knele", `Ivar sit, syster peikar og huldra kneler (${JSON.stringify(under9)})`);
    for (let n = 0; n < 100 && !T().st().flagg.pose2; n++) await vent(30);
    etterGang = M.aktor("Knelar").pose;
    sjekk(etterGang === null, "posen er borte når figuren går");
    for (let n = 0; n < 100 && !T().st().flagg.pose3; n++) await vent(30);
    sjekk(M.spelar.pose === "sove" && !M.aktor("fylgje").pose, "Ivar søv, og huldra står opp att (p: null)");
    await p9;
    await vent(100);
    sjekk(!M.spelar.pose && M.aktor("Syster").pose === "sitje" && !M.aktor("Knelar").pose, "etter hendinga står Ivar, og syster sit att ved bordet");
    sjekk(!feil9.length, `ingen feil når posane blir teikna${feil9.length ? ": " + feil9.join("; ") : ""}`);
    M.fjernFolk("Knelar");

    // 10. Åsen: hendingane i stova og på tunet. Syster gir niste, vakta ved kanten, og den
    //     første kampen, der syster og storebror kjem ut av stova og går inn att etterpå.
    const s10 = T().st(), varsel = [];
    const gamalWarn = w.console.warn; w.console.warn = (...a) => { varsel.push(a.join(" ")); gamalWarn.apply(w.console, a); };
    const naer = (a, b) => a && b && Math.abs(a.x - b.x) + Math.abs(a.y - b.y) === 1;
    const kanGaa = () => T().modus() === "felt" && !M.spelar.regi && !M.svart;
    // a) Syster står opp frå bordet, gir flatbrød og set seg att.
    delete s10.ord.kaka;
    const brod = s10.ting.flatbrod || 0;
    M.last("asen-stova", "1"); M.plasser(3, 5, 2); await vent(300);
    let stod = false, saaMot = false;
    tast("z");
    await trykkGjennom(() => s10.scener.syster_kake && !synleg("#rpg-tale"), () => {
      const sy = M.aktor("Syster");
      if (sy && !sy.pose) stod = true;
      if (sy && sy.dir === 3 && synleg("#rpg-tale") && /flatbrød/.test(d.querySelector("#rpg-tale").textContent)) saaMot = true;
    });
    await vent(300);
    const sy10 = M.aktor("Syster");
    sjekk(stod && saaMot, "syster stod opp og snudde seg mot Ivar då ho gav flatbrødet");
    sjekk(s10.ord.kaka && (s10.ting.flatbrod || 0) === brod + 1, "Ivar høyrde «kake» og fekk eit flatbrød");
    sjekk(sy10.x === 2 && sy10.y === 5 && sy10.pose === "sitje" && kanGaa(), `syster sit att ved bordet (${sy10.x},${sy10.y} ${sy10.pose}), og Ivar kan gå`);

    // b) Vakta ved kanten mot utmarka: Ivar snur og går eitt steg attende.
    delete s10.flagg.skiftebrev;
    M.last("asen", "1"); M.plasser(13, 0, 1); await vent(200);
    const dor = (x, y) => M.kart.dorer.find(o => o.ved[0] === x && o.ved[1] === y);
    let pv = M.krokar.dor(dor(13, 0));
    await trykkGjennom(() => !M.spelar.regi && !synleg("#rpg-tale") && T().modus() === "felt" && M.spelar.y === 1);
    await pv;
    sjekk(M.kart.id === "asen" && M.spelar.x === 13 && M.spelar.y === 1 && kanGaa(), `vakta mot utmarka: Ivar gjekk attende til ${M.spelar.x},${M.spelar.y}`);

    // c) For få ord: Ivar går attende frå kanten mot bygda.
    const ordFor = s10.ord; s10.ord = { stein: { former: { stein: {} } } };
    M.plasser(27, 11, 3); await vent(200);
    pv = M.krokar.dor(dor(27, 11));
    await trykkGjennom(() => M.spelar.x === 26 && !M.spelar.regi && !synleg("#rpg-tale"));
    await pv;
    sjekk(M.kart.id === "asen" && M.spelar.x === 26 && M.spelar.y === 11 && !s10.flagg.skiftebrev, "med for få ord går Ivar attende frå kanten mot bygda");

    sjekk(iHaugen && !M.aktor("Haugbonden") && !M.aktor("Vetten"), "han gjekk inn i haugen og er borte");
    sjekk(!talarBorte.length && !overlapp, `den som talar, står på kartet, og ingen står på same rute${talarBorte.length ? " (" + talarBorte.join(", ") + ")" : ""}`);
    sjekk(s12.ord.hoyra && s12.ord.laus && s12.stev.includes("steinstevet") && s12.flagg.huldra_auga, "Ivar høyrde «høyre» og «laus», lærte Steinstevet og fekk tilbodet om «auga»");
    sjekk(kampar12 === 0 && kanGaa(), "med rett namn blir det ingen kamp, og Ivar kan gå");
    M.last("utmarka", "1"); await vent(150);
    sjekk(!M.aktor("Vetten"), "vetten står ikkje framfor haugen når kartet blir lasta att");

    // d) Haugbonden, feil namn: kamp først, så får han namnet att og går inn i haugen.
    delete s12.flagg.haug; s12.stev = s12.stev.filter(x => x !== "steinstevet");
    M.last("utmarka", "1"); M.plasser(8, 9, 1); await vent(300);
    talarBorte = [];
    let fargaEtterKamp = false;
    tast("z");
    await gjennom(() => s12.flagg.haug && !M.aktor("Haugbonden") && ferdigFelt(), () => {
      sjekkTalar12(["Vetten", "Haugbonden", "Huldra"]);
      const h = M.aktor("Haugbonden");
      if (h && /Det var namnet mitt/.test(taleTekst()) && h.u === "haugbonde_namn" && kampar12 === 1) fargaEtterKamp = true;
    }, t => /Kven er vetten/.test(t) ? 2 : 1);
    sjekk(kampar12 === 1 && fargaEtterKamp, "feil namn: kamp, og etterpå har haugbonden namnet og fargane att");
    sjekk(!talarBorte.length && s12.stev.includes("steinstevet") && !M.aktor("Haugbonden") && kanGaa(), "den som talar, står på kartet, Ivar lærte stevet, og haugbonden er borte");

    // d2) Haugbonden hoppa over: forvandlinga blir ikkje vist, men han får namnet, og stevet blir vist.
    delete s12.flagg.haug; s12.stev = s12.stev.filter(x => x !== "steinstevet");
    M.last("utmarka", "1"); M.plasser(8, 9, 1); await vent(300);
    tast("z");
    for (let n = 0; n < 100 && !synleg("#rpg-tale"); n++) await vent(50);
    await vent(200); tast("x"); await vent(150); tast("z");
    let fvVist = false, stevVist12 = false;
    await gjennom(() => s12.flagg.haug && !M.aktor("Haugbonden") && ferdigFelt(), () => {
      if (d.querySelector(".rpg-forvandling:not(.rpg-naer)")) fvVist = true;
      if (/lærte «Steinstevet»/.test(taleTekst())) stevVist12 = true;
    }, lytt12);
    sjekk(!fvVist && stevVist12 && s12.flagg.haug && !M.aktor("Haugbonden") && !M.snogg && kanGaa(), "hoppa over: forvandlinga blir ikkje vist, stevet blir vist, og haugbonden er borte");

    // e) Tenaren på Ekset hentar kongesoga. Ivar går til sides så tenaren kjem ut frå bordet.
    delete s12.ord.vita; s12.nokkel = s12.nokkel.filter(x => x !== "sagabok");
    M.last("ekset-stova", "1"); M.plasser(6, 5, 1); await vent(300);
    talarBorte = []; overlapp = false;
    let vedHylla = false, gavBoka = false;
    tast("z");
    await gjennom(() => s12.nokkel.includes("sagabok") && ferdigFelt(), () => {
      sjekkTalar12(["Tenaren på Ekset"]);
      const tn = M.aktor("Tenaren på Ekset");
      if (tn.x === 9 && tn.y === 2) vedHylla = true;
      if (/Ivar blar i/.test(taleTekst()) && naer(tn, M.spelar)) gavBoka = true;
      if (!eiRute()) overlapp = true;
    });
    sjekk(vedHylla && gavBoka, "tenaren gjekk til hylla og kom med boka til Ivar");
    sjekk(!talarBorte.length && !overlapp && s12.ord.vita, "den som talar, står på kartet, ingen står på same rute, og Ivar høyrde «vite»");
    for (let n = 0; n < 80 && M.aktor("Tenaren på Ekset").regi; n++) await vent(50);
    const tn12 = M.aktor("Tenaren på Ekset");
    sjekk(tn12.x === 6 && tn12.y === 4 && kanGaa(), `tenaren gjekk attende til bordet (${tn12.x},${tn12.y}), og Ivar kan gå`);

    // f) Småpraten i utmarka og på Ekset: kvar replikk har ein talar på kartet.
    const ordFor12 = s12.ord;
    for (const [kart, merke, manus, flagg] of [["utmarka", "$", "gjetar"], ["utmarka", "$", "gjetar", "*"], ["ekset", "@", "husmann"], ["ekset", "@", "husmann", "*"],
      ["ekset", "%", "ekset_kone"], ["ekset-stova", "@", "tenar", "*"]]) {
      s12.ord = flagg === "*" ? ordFor12 : {};
      M.last(kart, "1"); await vent(150);
      const f = M.kart.folk.find(f => f.merke === merke);
      talarBorte = [];
      let ferdig = false;
      T().hending(w.RPGData.MANUS[manus]).then(() => { ferdig = true; });
      await gjennom(() => ferdig && !T().iHending(), () => sjekkTalar12([f.namn]));
      sjekk(ferdig && !talarBorte.length && kanGaa(), `${manus}${flagg ? " (" + flagg + ")" : ""}: ${f.namn} talar på kartet, og hendinga er ferdig`);
    }
    s12.ord = ordFor12;
    w.console.warn = gamalWarn;
    sjekk(!varsel12.some(v => /Regi/.test(v)), `ingen åtvaringar frå regien i utmarka og på Ekset${varsel12.length ? ": " + varsel12.join("; ") : ""}`);

    // g) Blekklatten. Ivar går gjennom opninga i hylleveggen (merke 5). Ein dråpe veks til blekklatten,
    //    og etter kampen går Ivar bort og les i kyrkjeboka. Så kjem kapittelslutten og tittelskjermen.
    w.console.warn = (...a) => { varsel12.push(a.join(" ")); gamalWarn.apply(w.console, a); };
    delete s12.flagg.latt; s12.kapittel = 1; kampar12 = 0;
    talarBorte = [];
    let draape = false, stor = false, stodVedBoka = false, lasIBoka = false;
    M.last("arkivet", "5");
    await gjennom(() => T().modus() === "tittel", () => {
      sjekkTalar12(["Blekklatten"]);
      const b = M.aktor("Blekklatten"), t = taleTekst();
      if (b && b.vesen === "blekkdrope" && /Midt i arkivet/.test(t)) draape = true;
      if (b && b.vesen === "blekklatten" && b.x === 10 && b.y === 4 && /Alt skal skrives/.test(t)) stor = true;
      if (/Det same som i boka/.test(t) && M.spelar.x === 10 && M.spelar.y === 4 && M.spelar.dir === 1) { stodVedBoka = true; lasIBoka = M.spelar.kjensle === "les"; }
    });
    sjekk(draape && stor, "ein dråpe renn ut av kyrkjeboka og veks til blekklatten framfor lesepulten");
    sjekk(kampar12 === 1 && s12.flagg.latt, "kampen mot blekklatten vart spela, og flagget er sett");
    sjekk(stodVedBoka && lasIBoka, "Ivar gjekk bort til kyrkjeboka og les i ho");
    sjekk(!talarBorte.length, "den som talar, står på kartet");
    sjekk(s12.dagbok.some(l => /namnet til far/.test(l.tekst)), "kyrkjeboka står i Dagboka");
    sjekk(T().modus() === "tittel" && T().st().kapittel === 2 && T().lagra().flagg.latt, "kapittelslutten kom, og spelet er lagra med blekklatten slegen");
    // Hald fram: arkivet utan blekklatten.
    for (let n = 0; n < 60 && !d.querySelector("#rpg-tittel-val button"); n++) await vent(50);
    d.querySelector("#rpg-tittel-val button").click();
    for (let n = 0; n < 60 && T().modus() !== "felt"; n++) await vent(50);
    await vent(400);
    const s12b = T().st();
    M.last("arkivet", "5"); await vent(400);
    sjekk(!M.aktor("Blekklatten") && !T().iHending() && kanGaa(), "attende i arkivet er blekklatten borte, og ingenting skjer i opninga");

    // h) Blekklatten hoppa over: kampen og kapittelslutten kjem likevel.
    delete s12b.flagg.latt; s12b.kapittel = 1; kampar12 = 0;
    M.last("arkivet", "5");
    for (let n = 0; n < 100 && !synleg("#rpg-tale"); n++) await vent(50);
    await vent(200); tast("x"); await vent(150); tast("z");
    let fortVist = false;
    await gjennom(() => T().modus() === "tittel", () => { if (synleg("#rpg-fort")) fortVist = true; });
    sjekk(kampar12 === 1 && s12b.flagg.latt && fortVist && T().modus() === "tittel", "hoppa over: kampen og kapittelslutten kom likevel");
    sjekk(!M.snogg, "snøggmodusen er slått av");
    for (let n = 0; n < 60 && !d.querySelector("#rpg-tittel-val button"); n++) await vent(50);
    d.querySelector("#rpg-tittel-val button").click();
    for (let n = 0; n < 60 && T().modus() !== "felt"; n++) await vent(50);
    w.Kamp.start = kampFor12;
    w.console.warn = gamalWarn;
    sjekk(!varsel12.some(v => /Regi/.test(v)), `ingen åtvaringar frå regien i arkivet${varsel12.length ? ": " + varsel12.join("; ") : ""}`);
    // 13. Ei hending som sluttar medan ei anna køyrer (eit tap som byrjar ei ny reise), lèt ikkje
    //     spelaren gå. Når den siste er slutt, kjem kameraet attende til Ivar om ei scena let det stå.
    M.last("asen", "1"); await vent(300);
    const ytre = T().hending([{ kamera: [2, 2], ms: 100 }, { vent: 900 }]);
    await T().hending([{ vent: 100 }]);
    const x13 = M.spelar.x;
    d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true })); await vent(400);
    d.dispatchEvent(new w.KeyboardEvent("keyup", { key: "ArrowRight", bubbles: true }));
    sjekk(M.spelar.x === x13 && T().iHending(), "Ivar står i ro så lenge den ytre hendinga køyrer");
    sjekk(M.kameraBorte, "kameraet står ved ruta scena sende det til");
    await ytre; await vent(800);
    sjekk(!M.kameraBorte && kanGaa(), "etter hendinga er kameraet attende hos Ivar, og han kan gå");
    if (gamalLagring == null) w.localStorage.removeItem(NOKKEL); else w.localStorage.setItem(NOKKEL, gamalLagring);
  } catch (e) { ut.push("FEIL " + e.stack); }
  document.getElementById("ut").textContent = ut.join("\n");
  // Spelet blir teke bort når testen er ferdig, så resten av den virtuelle tida går fort (sjå kjoyr-test.py).
  f.remove();
};
</script>
