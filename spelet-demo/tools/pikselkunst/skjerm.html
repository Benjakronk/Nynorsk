<!doctype html>
<meta charset="utf-8">
<title>Skjermbilete av spelet</title>
<!-- Brukt av skjermbilete.py: opnar spelet, går til eit kart og frys lerretet.
     Parametrar: kart, m (merke), x og y (der Ivar står), kamp (fiendar, kommaskilt),
     parti (fleire i partiet), hp (til dømes huldra:4), tale (namn:tekst),
     gaa (opp/ned/venstre/hogre), ventms, kjensle (til dømes sjokk) og hkjensle (for følgjet), pose (til dømes knele),
     retning (0 til 3, saman med pose), vinn=1, etter=1, flagg og opna (opna kister, kommaskilt),
     bakgrunn (kampbakgrunnen), scene og replikk (spel ei scene og frys ved replikk nr. n). -->
<style>body{margin:0;background:#000;color:#fff;font:12px monospace} iframe{width:1100px;height:720px;border:0;display:block} #ut{white-space:pre-wrap;padding:4px}</style>
<iframe id="f"></iframe>
<div id="ut">køyrer …</div>
<script>
const q = new URLSearchParams(location.search);
const f = document.getElementById("f");
f.src = "../../spel.html?test=1";
const vent = ms => new Promise(r => setTimeout(r, ms));
const feil = [];
f.onload = async () => {
  const w = f.contentWindow, d = w.document, M = w.Motor;
  w.addEventListener("error", e => feil.push(e.message + " :" + e.lineno));
  const tast = async k => { d.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true })); await vent(30); d.dispatchEvent(new w.KeyboardEvent("keyup", { key: k, bubbles: true })); };
  const synleg = sel => { const e = d.querySelector(sel); return e && !e.hidden; };
  // Frys lerretet: eit bilete av det over lerretet, så det ikkje endrar seg før skjermbiletet blir teke.
  const frys = () => { const c = d.getElementById("rpg-lerret"), img = d.createElement("img"); img.src = c.toDataURL(); img.style.cssText = `position:absolute;width:${c.style.width};height:${c.style.height};image-rendering:pixelated;z-index:9;pointer-events:none`; const r = c.getBoundingClientRect(), p = d.getElementById("rpg-skjerm").getBoundingClientRect(); img.style.left = (r.left - p.left) + "px"; img.style.top = (r.top - p.top) + "px"; d.getElementById("rpg-skjerm").appendChild(img); };
  const blaFram = async () => { let n = 0; while (n++ < 200 && (synleg("#rpg-tale") || synleg("#rpg-fort"))) { await tast("z"); await vent(80); } };
  // Vent til grafikken er lasta og tittelskjermen har knappar.
  for (let n = 0; n < 200 && !d.querySelector("#rpg-tittel-val button"); n++) await vent(50);
  d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Enter", bubbles: true })); d.dispatchEvent(new w.KeyboardEvent("keyup", { key: "Enter", bubbles: true }));   // første valet på tittelskjermen (berre tastar)
  // Opningsscena (Storebror i stova) blir spela ferdig før vi går til kartet, elles kjem samtalen
  // hans over biletet, og scena held fram på eit kart der han ikkje finst.
  // opning=ms (runde 90): skjermbilete av opningsscena sjølv, ms etter at forteljinga og kortet er borte
  // (Ivar søv i senga, tonar inn, vaknar). sidan=n trykkjer gjennom dei n første replikkane i scena òg.
  if (q.get("opning")) {
    await vent(300);
    for (let n = 0; n < 300 && !(w.RPGTest.iHending() && !synleg("#rpg-fort") && !d.querySelector(".rpg-kort") && w.Motor.spelar.pose); n++) {
      if (synleg("#rpg-fort") || d.querySelector(".rpg-kort")) await tast("z");
      await vent(80);
    }
    for (let i = 0; i < +(q.get("sidan") || 0); i++) { for (let n = 0; n < 100 && !synleg("#rpg-tale"); n++) await vent(50); await vent(600); await tast("z"); await vent(300); }
    await vent(+q.get("opning")); frys();
    // Scena går vidare til skjermbiletet blir teke: er det ingen replikk no, skal ingen kome på biletet.
    if (!synleg("#rpg-tale")) { const st = d.createElement("style"); st.textContent = "#rpg-tale{visibility:hidden!important}"; d.head.appendChild(st); }
    document.getElementById("ut").textContent = "ferdig, feil: " + JSON.stringify(feil); return;
  }
  // Ventar til «heime» er ferdig (ho tonar inn og Ivar vaknar i senga først, runde 90).
  await vent(300); for (let n = 0; n < 150 && !(w.RPGTest.st().scener.heime && !w.RPGTest.iHending()); n++) { await blaFram(); await vent(100); }
  w.RPGTest.st().flagg.framande1 = true;
  // flagg=skiftebrev,stabburnokkel set flagg før kartet blir lasta (til dømes skrinet etter far i stova).
  for (const fl of (q.get("flagg") || "").split(",").filter(Boolean)) w.RPGTest.st().flagg[fl] = true;
  // opna=k-stova,k-skrin: kistene er opna (for å sjå den opne kista).
  for (const id of (q.get("opna") || "").split(",").filter(Boolean)) w.RPGTest.st().opna.push(id);
  // stemning=ingen (eller eit anna namn) byter lyset på kartet, til dømes for å sjå fargane utan kveldslys.
  // variant=dal (eller eit anna namn) vel kva utsikt kartet har nedst (sjå variant i data.js).
  // skra=a|b|c vel korleis skråkanten under eit overheng møter berget bak (sjå skra i data.js).
  if (q.get("skra")) w.RPGData.KART[q.get("kart") || "asen"].skra = q.get("skra");
  if (q.get("variant")) w.RPGData.KART[q.get("kart") || "asen"].variant = q.get("variant");
  if (q.get("stemning")) w.RPGData.KART[q.get("kart") || "asen"].stemning = q.get("stemning") === "ingen" ? undefined : q.get("stemning");
  // bakgrunn=klokketarn vel kampbakgrunnen (som kamp-steget med eigen bakgrunn i ei scene).
  if (q.get("bakgrunn")) w.RPGData.KART[q.get("kart") || "asen"].bakgrunn = q.get("bakgrunn");
  M.last(q.get("kart") || "asen", q.get("m") || "1"); await vent(400); await blaFram();
  if (q.get("x")) Object.assign(M.spelar, { x: +q.get("x"), y: +q.get("y"), fx: +q.get("x"), fy: +q.get("y"), dir: 0 });
  // parti=huldra legg til medlemer, hp=huldra:4 set livet (til dømes for å sjå «svak» og «slått ut» i kampen).
  const st = w.RPGTest.st();
  for (const id of (q.get("parti") || "").split(",").filter(Boolean)) if (!st.parti.some(m => m.id === id)) st.parti.push({ id, niva: st.parti[0].niva, xp: 0, hp: null, rost: null });
  for (const x of (q.get("hp") || "").split(",").filter(Boolean)) { const [id, n] = x.split(":"), m = st.parti.find(m => m.id === id); if (m) m.hp = +n; }
  // scene=kyrkjegrimen&replikk=3: spelar ei scene og frys biletet ved replikk nr. 3 (talt frå 0). Kampar i
  // scena blir vunne med ein gong (stubba), så ein kan sjå det som skjer etterpå.
  if (q.get("scene")) {
    w.Kamp.start = async () => ({ utfall: "siger", xp: 0, pengar: 0, fall: [] });
    w.RPGTest.scene(q.get("scene"));
    for (let i = 0; i <= +(q.get("replikk") || 0); i++) {
      let n = 0; while (n++ < 400 && !(synleg("#rpg-tale") || synleg("#rpg-fort"))) await vent(50);
      if (i === +(q.get("replikk") || 0)) { await vent(2500); break; }       // den siste: ferdigskriven
      // Z skriv ferdig replikken eller går vidare: står same teksten der etterpå, trykk ein gong til.
      await vent(400);
      const tekst = () => d.getElementById("rpg-tale").textContent + d.getElementById("rpg-fort").textContent;
      const for_ = tekst(); await tast("z"); await vent(200);
      if (synleg("#rpg-tale") && tekst() === for_) { await tast("z"); await vent(200); }
    }
    frys(); document.getElementById("ut").textContent = "ferdig, feil: " + JSON.stringify(feil); return;
  }
  // kampms=300: frys biletet så lenge etter at kampen er starta (for å sjå pikseleffekten og toninga).
  if (q.get("kamp") && q.get("kampms")) { M.krokar.kamp(q.get("kamp").split(",")); await vent(+q.get("kampms")); frys(); document.getElementById("ut").textContent = "ferdig"; return; }
  if (q.get("kamp")) { M.krokar.kamp(q.get("kamp").split(",")); let n = 0; while (!synleg(".kamp-meny") && n++ < 300) await vent(50); }
  // tale=Huldra:Teksten opnar samtaleboksen med portrettet til den som talar.
  if (q.get("kjensle")) M.kjensle(q.get("kjensle"));
  if (q.get("hkjensle")) M.kjensle(q.get("hkjensle"), "fylgje");
  if (q.get("pose")) { M.pose(q.get("pose")); if (q.get("retning")) M.spelar.dir = +q.get("retning"); }
  // glid=h eller glid=v (runde 92): Ivar glir sitjande langs benken frå ruta til venstre (h) eller høgre (v),
  // tidleg i steget, så ramma for å flytte seg sidelengs syner (saman med pose=sitje).
  if (q.get("glid")) { const s = M.spelar, fra = s.x + (q.get("glid") === "v" ? 1 : -1); Object.assign(s, { flytt: { fx: fra, fy: s.y, t0: w.performance.now(), fart: 1e9, glid: true }, u: 0, fx: fra + (s.x - fra) * 0.15 }); }
  // snu=Klokka:3 snur ein person eller eit vesen på kartet (0 ned, 1 opp, 2 venstre, 3 høgre), til dømes for å sjå ei ramme i eit gangark.
  // vesen=Klokka:klokke-0,Dua:due-fly-3 byter biletet til vesen på kartet (til dømes ei ramme i ei sving).
  for (const x of (q.get("vesen") || "").split(",").filter(Boolean)) { const [namn, v] = x.split(":"); M.byt(namn, { vesen: v }); }
  if (q.get("snu")) { const [namn, r] = q.get("snu").split(":"), a = M.kart.folk.find(f => f.namn === namn || f.merke === namn); if (a) a.dir = +r; }
  if (q.get("tale")) { const [namn, ...t] = q.get("tale").split(":"); M.tale(t.join(":") || "…", namn, q.get("kjensle")); await vent(2500); }
  // gaa=opp held ei piltast nede i «ventms» millisekund før biletet blir teke (til dømes for å sjå ei dør opne seg).
  if (q.get("gaa")) {
    const k = { opp: "ArrowUp", ned: "ArrowDown", venstre: "ArrowLeft", hogre: "ArrowRight" }[q.get("gaa")];
    await vent(600); d.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true }));
    await vent(+(q.get("ventms") || 300)); frys(); d.dispatchEvent(new w.KeyboardEvent("keyup", { key: k, bubbles: true }));
    document.getElementById("ut").textContent = "ferdig, feil: " + JSON.stringify(feil); return;
  }
  // vinn=1: alle fiendane fell, så ein kan sjå sigerfeiringa og løna i kampscena.
  if (q.get("vinn")) {
    const fi = w.KampTest.fiendar; fi.forEach((f, i) => { f.hp = i < fi.length - 1 ? 0 : 1; });
    for (const k of ["z", "z"]) { d.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true })); await vent(40); d.dispatchEvent(new w.KeyboardEvent("keyup", { key: k, bubbles: true })); await vent(300); }
    await vent(+(q.get("ventms") || 2400));
    // etter=1: bla gjennom sigerlinene og sjå kartet kome att etter kampen.
    if (q.get("etter")) for (let n = 0; n < 8; n++) { d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "z", bubbles: true })); await vent(40); d.dispatchEvent(new w.KeyboardEvent("keyup", { key: "z", bubbles: true })); await vent(350); } frys(); document.getElementById("ut").textContent = "ferdig, feil: " + JSON.stringify(feil); return; }
  await vent(900); frys();
  document.getElementById("ut").textContent = "ferdig, feil: " + JSON.stringify(feil);
};
</script>
