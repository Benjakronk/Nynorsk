<!doctype html>
<meta charset="utf-8">
<title>Sjekk gangen i kyrkja</title>
<!-- Måler kor lang tid Ivar brukar frå døra i kyrkja (merke 1) opp til altarringen (rad 9):
     først gåande (pil opp), så springande (Z og pil opp). Målet er 33 fliser: 6,6 sekund å gå
     (12 tikk per flis) og om lag 6,7 sekund å springe (8 tikk per flis). Til slutt: trappa, preikestolen,
     klokketauet og kyrkjegrimen (sju drag i eitt besøk i tårnet, runde 98).
     Køyr: python tools/kjoyr-test.py tools/sjekk-kyrkjegang.html 60000 -->
<style>body{margin:0;background:#000;color:#fff;font:12px monospace} iframe{width:1100px;height:720px;border:0} #ut{white-space:pre-wrap;padding:4px}</style>
<iframe id="f"></iframe>
<div id="ut">køyrer …</div>
<script>
const f = document.getElementById("f");
f.src = "../spel.html?test=1";
const vent = ms => new Promise(r => setTimeout(r, ms));
f.onload = async () => {
  const w = f.contentWindow, d = w.document, M = w.Motor;
  const tast = (type, k) => d.dispatchEvent(new w.KeyboardEvent(type, { key: k, bubbles: true }));
  const synleg = sel => { const e = d.querySelector(sel); return e && !e.hidden; };
  for (let n = 0; n < 200 && !d.querySelector("#rpg-tittel-val button"); n++) await vent(50);
  d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Enter", bubbles: true })); d.dispatchEvent(new w.KeyboardEvent("keyup", { key: "Enter", bubbles: true }));   // første valet på tittelskjermen (berre tastar)
  await vent(300);
  for (let n = 0; n < 400 && (!w.RPGTest.st().scener.heime || synleg("#rpg-tale") || synleg("#rpg-fort")); n++) { tast("keydown", "z"); await vent(30); tast("keyup", "z"); await vent(60); }
  await vent(1000);
  const ut = [];
  let ok = true;
  const D = w.RPGData.KART.kyrkja, dor = D.rader.findIndex(r => r.includes("1"));
  ut.push(`fliser frå merke 1 (rad ${dor}) til framfor altarringen (rad 9): ${dor - 9}`);
  if (dor - 9 !== 33) { ok = false; ut.push("FEIL: avstanden skal vere 33 fliser"); }
  for (const [namn, springe, maal] of [["gå", false, 33 * 0.2], ["springe", true, 33 * 8 / 60]]) {
    M.last("kyrkja", "1"); await vent(400);
    M.spelar.dir = 1;                                   // ser opp, så det første steget ikkje er ei snuing
    const t0 = w.performance.now();
    if (springe) tast("keydown", "z");
    tast("keydown", "ArrowUp");
    let t1 = null;
    for (let n = 0; n < 2000 && t1 === null; n++) { await vent(10); if (M.spelar.fy <= 9) t1 = w.performance.now(); }
    tast("keyup", "ArrowUp"); if (springe) tast("keyup", "z");
    const s = t1 === null ? null : (t1 - t0) / 1000;
    const rett = s !== null && Math.abs(s - maal) < 0.35;
    if (!rett) ok = false;
    ut.push(`${rett ? "OK" : "FEIL"}: å ${namn} frå døra til altarringen tok ${s === null ? "for lang tid (stoppa på " + M.spelar.x + "," + M.spelar.y + ")" : s.toFixed(2) + " s"} (venta ${maal.toFixed(2)} s)`);
    await vent(300);
  }
  // Trappa: frå våpenhuset opp på galleriet, vidare opp i tårnet, og ned att same vegen.
  const gaaTil = async (kart, merke, tast_, maal, x, y) => {
    M.last(kart, merke); await vent(400);
    tast("keydown", tast_);
    let n = 0; while (n++ < 300 && M.kart.id !== maal) await vent(20);
    tast("keyup", tast_); await vent(700);
    const rett = M.kart.id === maal && (x == null || (M.spelar.x === x && M.spelar.y === y));
    if (!rett) ok = false;
    ut.push(`${rett ? "OK" : "FEIL"}: frå ${kart} (${merke}) til ${M.kart.id} (${M.spelar.x},${M.spelar.y})`);
  };
  await gaaTil("kyrkja", "3", "ArrowUp", "kyrkje-galleri", 10, 10);
  await gaaTil("kyrkje-galleri", "2", "ArrowDown", "kyrkje-tarn", 6, 10);
  await gaaTil("kyrkje-tarn", "1", "ArrowDown", "kyrkje-galleri", 19, 10);
  await gaaTil("kyrkje-galleri", "1", "ArrowDown", "kyrkja", 8, 38);
  // Preikestolen: frå koret (5,11) mot venstre inn i veggen, gjennom gangen (skjult), inn i døropninga
  // bak preikestolen (1,11) og eitt steg ned i korga (1,12).
  M.last("kyrkja", "1"); await vent(300);
  M.plasser(5, 11, 2); await vent(300);
  const skjult = w.RPGData.KART.kyrkja.skjult || [];
  let varSkjult = false;
  tast("keydown", "ArrowLeft");
  { let n = 0; while (n++ < 300 && M.spelar.x !== 1) { await vent(20); if (skjult.includes(M.spelar.x + "," + M.spelar.y)) varSkjult = true; } }
  tast("keyup", "ArrowLeft"); await vent(500);
  const iOpninga = M.spelar.x === 1 && M.spelar.y === 11 && varSkjult && !skjult.includes("1,11");
  tast("keydown", "ArrowDown");
  { let n = 0; while (n++ < 100 && M.spelar.y !== 12) await vent(20); }
  tast("keyup", "ArrowDown"); await vent(500);
  const iStolen = iOpninga && M.spelar.x === 1 && M.spelar.y === 12;
  if (!iStolen) ok = false;
  ut.push(`${iStolen ? "OK" : "FEIL"}: Ivar gjekk inn i veggen frå koret, skjult gjennom gangen, inn i døropninga og ned i preikestolen (${M.spelar.x},${M.spelar.y})`);
  // Midt i steget inn i døra (x 4,5): muren dekkjer den delen av Ivar som er over gangen, resten syner.
  // Pikslane til Ivar blir talde ved å samanlikne lerretet med eit der ruta han står på òg er skjult
  // (då er han heilt borte), både midt i steget og når han står heilt ute på (5,11). Berre pikslar som
  // er like i dei to skjulte bileta tel. Tida og tilfeldige tal står stille medan bileta blir tekne, så
  // lys, støv og folk ikkje endrar seg.
  {
    const lerret = d.getElementById("rpg-lerret"), cx = lerret.getContext("2d");
    const bilete = async () => { await vent(120); return cx.getImageData(0, 0, lerret.width, lerret.height).data; };
    const ulik = (p, q, i) => Math.abs(p[i] - q[i]) + Math.abs(p[i + 1] - q[i + 1]) + Math.abs(p[i + 2] - q[i + 2]) > 12;
    const gml = D.skjult;
    const synlege = async x => {
      Object.assign(M.spelar, { x, y: 11, fx: x, fy: 11, dir: 2 }); await vent(600);
      const ekteNo = w.performance.now, ekteTilf = w.Math.random, fast = ekteNo.call(w.performance);
      w.performance.now = () => fast; w.Math.random = () => 0.5;
      D.skjult = gml.concat(["5,11"]); const b1 = await bilete();
      D.skjult = gml; const a = await bilete();
      D.skjult = gml.concat(["5,11"]); const b2 = await bilete();
      D.skjult = gml; w.performance.now = ekteNo; w.Math.random = ekteTilf;
      let n = 0;
      for (let i = 0; i < a.length; i += 4) if (!ulik(b1, b2, i) && ulik(a, b1, i)) n++;
      return n;
    };
    const heil = await synlege(5), del = await synlege(4.5);
    const delvis = heil > 40 && del > heil * 0.15 && del < heil * 0.85;
    if (!delvis) ok = false;
    ut.push(`${delvis ? "OK" : "FEIL"}: midt i steget inn i døra syner ${del} av ${heil} pikslar av Ivar (resten er bak muren)`);
    M.plasser(1, 12, 0); await vent(300);
  }
  // Z mot bibelen i preikestolen, og mot klokketauet i tårnet: hendinga går, og teksten kjem.
  const tekst = () => [...d.querySelectorAll("#rpg-tale, #rpg-fort")].filter(e => !e.hidden).map(e => e.textContent).join(" ");
  const trykkGjennom = async (finn, kvar) => {
    let sett = false;
    for (let n = 0; n < 120; n++) {
      if (finn.test(tekst())) { sett = true; if (kvar) kvar(); }
      tast("keydown", "z"); await vent(40); tast("keyup", "z"); await vent(160);
      if (n > 3 && !w.RPGTest.iHending() && !synleg("#rpg-tale") && !synleg("#rpg-fort")) break;
    }
    return sett;
  };
  M.spelar.dir = 0; await vent(100);
  const preika = await trykkGjennom(/kyrkjelyd|benkene/);
  if (!preika) ok = false;
  ut.push(`${preika ? "OK" : "FEIL"}: Z mot bibelen i preikestolen gir ei lita preike`);
  M.last("kyrkje-tarn", "1"); await vent(300); M.plasser(8, 8, 1); await vent(300);
  const utslag = new Set();
  const dong = await trykkGjennom(/DONG/, () => utslag.add(M.aktor("Klokka").vesen));
  const svinga = utslag.has("klokke-0") && utslag.has("klokke-8") && M.aktor("Klokka").vesen === "klokke-4";
  if (!dong || !svinga) ok = false;
  ut.push(`${dong && svinga ? "OK" : "FEIL"}: Ivar dreg i klokketauet, klokka svingar ut til begge sider og slår (DONG), og heng stille etterpå`);
  const flaug = !M.aktor("Dua");
  if (!flaug) ok = false;
  ut.push(`${flaug ? "OK" : "FEIL"}: dua flaug ut gjennom lydluka`);
  const dong2 = await trykkGjennom(/DONG/);
  if (!dong2) ok = false;
  ut.push(`${dong2 ? "OK" : "FEIL"}: klokka kan slå ein gong til`);
  M.last("kyrkje-tarn", "1"); await vent(300);
  const att = !!M.aktor("Dua");
  if (!att) ok = false;
  ut.push(`${att ? "OK" : "FEIL"}: dua er attende når Ivar kjem inn i tårnet att`);
  // Kyrkjegrimen: sju drag i klokketauet i eitt besøk i tårnet vekkjer han, éin gong. Kampen er stubba
  // (siger med ein gong). Så testen held seg innanfor tidsbudsjettet, går pausane og ristinga i regien
  // tjue gonger fortare (toninga, blinket og ristinga ti), og replikkane blir berre noterte (kven som talar og teksten), utan samtaleboks.
  // Eit drag er å trykkje Z mot tauet og vente til hendinga er slutt.
  {
    const tGrim = w.performance.now();
    const st = w.RPGTest.st(), venteFor = M.vent, ristFor = M.rist, taleFor = M.tale, toneFor = M.tone, blinkFor = M.blink, kampFor = w.Kamp.start;
    M.vent = ms => venteFor(Math.max(1, ms / 20)); M.rist = (ms, s) => ristFor(Math.max(1, ms / 10), s);
    M.tone = (l, rgb, ms) => toneFor(l, rgb, Math.max(1, (ms || 1000) / 10)); M.blink = (ms, rgb) => blinkFor(Math.max(1, (ms || 300) / 10), rgb);
    const replikkar = [];
    M.tale = async (t, namn) => { replikkar.push({ namn: namn || "", t: String(t) }); };
    const kampar = [];
    let grimPaaKartet = false, bakgrunn = null;
    w.Kamp.start = async o => { kampar.push(o.fiendar.join(",")); bakgrunn = o.bakgrunn; grimPaaKartet = !!M.aktor("Kyrkjegrimen"); return { utfall: "siger", xp: 0, pengar: 0, fall: [] }; };
    const inn = async () => { M.last("kyrkje-tarn", "1"); await vent(200); M.plasser(8, 8, 1); await vent(100); };
    const drag = async () => {
      M.spelar.dir = 1; await vent(10);
      tast("keydown", "z"); await vent(20); tast("keyup", "z");
      for (let n = 0; n < 900 && (n < 4 || w.RPGTest.iHending()); n++) await vent(15);
      await vent(20);
    };
    // Fire drag, ut og inn att, og tre til: teljaren gjeld eitt besøk, så sju til saman gjer ingenting.
    await inn(); for (let i = 0; i < 4; i++) await drag();
    await inn(); for (let i = 0; i < 3; i++) await drag();
    const dong = replikkar.filter(r => /DONG/.test(r.t)).length;
    const fordelt = kampar.length === 0 && !st.flagg.kyrkjegrimen && dong === 14;
    if (!fordelt) ok = false;
    ut.push(`${fordelt ? "OK" : "FEIL"}: fire drag, ut av tårnet og tre til gjer ingenting (teljaren gjeld eitt besøk, ${dong} DONG)`);
    await inn(); for (let i = 0; i < 6; i++) await drag();
    const seks = kampar.length === 0 && !M.aktor("Kyrkjegrimen") && !st.flagg.kyrkjegrimen && M.aktor("Klokka").vesen === "klokke-4";
    if (!seks) ok = false;
    ut.push(`${seks ? "OK" : "FEIL"}: seks drag i klokketauet gjer ikkje noko særskilt`);
    const dagbokFor = st.dagbok.length, fraNo = replikkar.length;
    await drag();
    const sjuande = kampar.length === 1 && kampar[0] === "kyrkjegrimen" && grimPaaKartet && bakgrunn === "klokketarn";
    if (!sjuande) ok = false;
    ut.push(`${sjuande ? "OK" : "FEIL"}: det sjuande draget vekkjer kyrkjegrimen på kartet, og kampen mot han byrjar i klokketårnet (${kampar.join(";")}, bakgrunn ${bakgrunn})`);
    const scena = replikkar.slice(fraNo), grim = scena.filter(r => r.namn === "Kyrkjegrimen");
    const attande = scena.filter(r => /DONG/.test(r.t)).length === 3 && scena.some(r => /åttande/.test(r.t));
    const replikk = attande && grim.length >= 5 && grim.some(r => /⟨[^⟩]+⟩/.test(r.t));
    if (!replikk) ok = false;
    ut.push(`${replikk ? "OK" : "FEIL"}: klokka slår ein åttande gong av seg sjølv, og kyrkjegrimen talar ${grim.length} gonger, med norrøn tale`);
    const lon = !!st.flagg.kyrkjegrimen && !!st.ord.heilag && st.dagbok.length === dagbokFor + 1 && /kyrkjegrimen/.test(st.dagbok[st.dagbok.length - 1].tekst) && !M.aktor("Kyrkjegrimen");
    if (!lon) ok = false;
    ut.push(`${lon ? "OK" : "FEIL"}: etter sigeren er flagget sett, Ivar har ordet «heilag», Dagboka har ei ny line, og grimen er borte`);
    const lyset = (M.lysEffekt.tone.bak || {}).til ? M.lysEffekt.tone.bak.til.every(v => v === 0) && M.lysEffekt.tone.fig.til.every(v => v === 0) : true;
    if (!lyset) ok = false;
    ut.push(`${lyset ? "OK" : "FEIL"}: lyset i tårnet er vanleg att`);
    await inn(); for (let i = 0; i < 7; i++) await drag();
    const berreEin = kampar.length === 1 && !M.aktor("Kyrkjegrimen") && M.aktor("Klokka").vesen === "klokke-4";
    if (!berreEin) ok = false;
    ut.push(`${berreEin ? "OK" : "FEIL"}: etter sigeren kan klokka ringjast som før, og grimen kjem ikkje att (${kampar.length} kamp)`);
    M.vent = venteFor; M.rist = ristFor; M.tale = taleFor; M.tone = toneFor; M.blink = blinkFor; w.Kamp.start = kampFor;
    ut.push(`(kyrkjegrimen: ${((w.performance.now() - tGrim) / 1000).toFixed(1)} s, heile testen: ${(w.performance.now() / 1000).toFixed(1)} s)`);
  }
  ut.push(ok ? "Alt ser rett ut." : "Noko er feil.");
  document.getElementById("ut").textContent = ut.join("\n");
  f.remove();
};
</script>
